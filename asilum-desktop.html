        ${whoToFollow.map(b=>`<div class="rr-row"><div class="rr-av" style="background:${this.avatar(b)}" onclick="App.openUser('${b.id}')"></div>
          <div class="rr-b" onclick="App.openUser('${b.id}')"><div class="rr-name">${esc(b.name)} ${b.verified?'<span class="tw-verify">✦</span>':''}</div><div class="rr-sub">@${esc(b.handle)}</div></div>
          <button class="follow-btn" onclick="App.followUser('${b.id}')">Follow</button></div>`).join("")}
        <div class="rr-more" onclick="App.go('editorial')">Show more</div>
      </div>
      <div class="mono faint" style="font-size:10px;padding:0 6px 20px;line-height:1.6">*ASILUM · aggregating ${SOURCE_KEYS.length} marketplaces · ${this.catalog.length} pieces · legitimate sources only</div>`;

  renderTickerBox(){ const b=document.getElementById("tickerBox"); if(!b) return;
    b.innerHTML=`<div class="tk-h">● LIVE</div>${this.ticker.slice(0,6).map(t=>`<div class="tk-line">${t.html}</div>`).join("")}`; },
  searchInput(q){ clearTimeout(this._st); this._st=setTimeout(()=>this.doSearch(q),200); },
  doSearch(q){ const r=document.getElementById("searchResults"); if(!q||q.length<2){r.innerHTML="";return;}
    const ql=q.toLowerCase();
    let res=this.catalog.filter(it=>it.brand.toLowerCase().includes(ql)||it.name.toLowerCase().includes(ql)||it.cat.includes(ql)||Object.keys(it.tags).some(t=>t.toLowerCase().includes(ql)&&it.tags[t]>.3));
    res.sort((a,b)=>Brain.score(b)-Brain.score(a));
    const tagHit=TAGS.find(t=>t.toLowerCase()===ql||t.toLowerCase().includes(ql));
    Brain.signal("search",{tags: tagHit?[tagHit]:(res[0]?Object.keys(res[0].tags).filter(t=>res[0].tags[t]>.3):[])});
    r.innerHTML=res.length?`<div class="rr-card"><div class="rr-h" style="font-size:14px">${res.length} results</div>${res.slice(0,7).map(it=>`
      <div class="rr-row" onclick="App.openItem('${it.id}')"><div class="rr-av" style="border-radius:6px;background:${swatch(it)}"></div>
      <div class="rr-b"><div class="rr-name">${esc(it.brand)}</div><div class="rr-sub">${SOURCES[it.source].label} · ${money(it.price)}</div></div></div>`).join("")}</div>`
      :`<div class="rr-card"><div class="rr-h" style="font-size:13px">No matches</div></div>`;
  },
});

/* =====================================================================
   BRAIN VISUALIZATION — rotating 10-tag word-sphere.
   ===================================================================== */
const BrainViz={ running:false,nodes:[],edges:[],rot:{x:-.35,y:0},drag:null,raf:null,
  build(){ const N=TAGS.length; this.nodes=TAGS.map((tag,i)=>{ const phi=Math.acos(1-2*(i+.5)/N),th=Math.PI*(1+Math.sqrt(5))*(i+.5);
    return {tag,x:Math.sin(phi)*Math.cos(th),y:Math.cos(phi),z:Math.sin(phi)*Math.sin(th),pulse:0,red:0}; });
    this.edges=[]; TAGS.forEach((a,i)=>TAGS.forEach((b,j)=>{ if(j<=i)return; const af=(TAG_AFFINITY[a]&&TAG_AFFINITY[a][b])||(TAG_AFFINITY[b]&&TAG_AFFINITY[b][a])||0;
      if(af>0) this.edges.push({a:i,b:j,af,life:1,dying:false}); })); },
  flag(dead){ dead.forEach(t=>{ const n=this.nodes.find(x=>x.tag===t); if(n)n.red=1; this.edges.forEach(e=>{ if(this.nodes[e.a].tag===t||this.nodes[e.b].tag===t)e.dying=true; }); }); },
  pulse(){ const r=Brain.meta.recent[0]; if(!r)return; const n=this.nodes.find(x=>x.tag===r.tag); if(n){ if(r.kind==="forget"||r.kind==="skip")n.red=.9; else n.pulse=.9; } },
  start(){ if(this.running)return; this.running=true; this.build();
    const cv=document.getElementById("brainCanvas"),wrap=document.getElementById("brainWrap"); if(!cv)return;
    const dpr=window.devicePixelRatio||1; const size=()=>{cv.width=wrap.clientWidth*dpr;cv.height=340*dpr;cv.style.height="340px";}; size();
    cv.onpointerdown=e=>{this.drag={x:e.clientX,y:e.clientY};}; window.onpointermove=e=>{ if(!this.drag)return; this.rot.y+=(e.clientX-this.drag.x)*.008; this.rot.x=clamp(this.rot.x+(e.clientY-this.drag.y)*.008,-1.4,1.4); this.drag={x:e.clientX,y:e.clientY}; };
    window.onpointerup=()=>this.drag=null;
    const loop=()=>{ if(!this.running)return; this.draw(cv,dpr); this.raf=requestAnimationFrame(loop); }; loop(); },
  stop(){ this.running=false; if(this.raf)cancelAnimationFrame(this.raf); },
  draw(cv,dpr){ const ctx=cv.getContext("2d"),W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); if(!this.drag)this.rot.y+=.004;
    const now=Date.now(); Brain.meta.recent.slice(0,8).forEach(ev=>{ if(now-ev.t>2500||!ev.tag)return; const n=this.nodes.find(x=>x.tag===ev.tag); if(!n)return; if(ev.kind==="forget"||ev.kind==="skip")n.red=Math.max(n.red,.85); else n.pulse=Math.max(n.pulse,.9); });
    Brain.meta.forgotten.slice(0,5).forEach(f=>{ if(now-f.t>4000)return; const n=this.nodes.find(x=>x.tag===f.tag); if(n)n.red=1; this.edges.forEach(e=>{if(this.nodes[e.a].tag===f.tag||this.nodes[e.b].tag===f.tag)e.dying=true;}); });
    const R=Math.min(W,H)*.36,cx=W/2,cy=H/2,cyy=Math.cos(this.rot.y),syy=Math.sin(this.rot.y),cxx=Math.cos(this.rot.x),sxx=Math.sin(this.rot.x);
    const proj=n=>{ let x=n.x*cyy+n.z*syy,z=-n.x*syy+n.z*cyy,y=n.y*cxx-z*sxx; z=n.y*sxx+z*cxx; const s=1.6/(2.4-z); return {sx:cx+x*R*s,sy:cy+y*R*s,s,z}; };
    const P=this.nodes.map(proj);
    this.edges=this.edges.filter(e=>e.life>.02);
    this.edges.forEach(e=>{ const a=P[e.a],b=P[e.b],na=this.nodes[e.a],nb=this.nodes[e.b]; if(e.dying)e.life*=.9;
      const hot=Math.max(na.pulse,nb.pulse),red=Math.max(na.red,nb.red),depth=(a.z+b.z)/2,al=(.05+.22*Math.max(0,depth))*e.af*e.life;
      ctx.beginPath(); if(e.dying){ const mx=(a.sx+b.sx)/2+(1-e.life)*26*(Math.random()-.5),my=(a.sy+b.sy)/2+(1-e.life)*44; ctx.moveTo(a.sx,a.sy);ctx.lineTo(mx,my); ctx.strokeStyle=`rgba(229,52,43,${al*2.2})`; }
      else{ ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy); ctx.strokeStyle=red>.2?`rgba(229,52,43,${al+red*.25})`:hot>.2?`rgba(255,255,255,${al+hot*.4})`:`rgba(190,190,205,${al})`; }
      ctx.lineWidth=(hot>.2?1.4:.7)*dpr*.8; ctx.stroke(); });
    P.map((p,i)=>({p,i})).sort((a,b)=>a.p.z-b.p.z).forEach(({p,i})=>{ const n=this.nodes[i]; n.pulse*=.94; n.red*=.955;
      const w=Math.abs(Brain.vec[n.tag]||.06),depth=Math.max(.15,(p.z+1)/2),fs=(9+w*15+n.pulse*4)*p.s*dpr*.72;
      ctx.font=`${n.pulse>.3?"700":"400"} ${fs}px Menlo,monospace`;
      ctx.fillStyle=n.red>.15?`rgba(229,52,43,${.35+n.red*.65})`:n.pulse>.15?`rgba(255,255,255,${.55+n.pulse*.45})`:`rgba(226,223,215,${.18+depth*.5+w*.3})`;
      ctx.textAlign="center"; ctx.fillText(n.tag,p.sx,p.sy); });
    if(!this._t||now-this._t>1200){ this._t=now; App.renderBrainStats&&App.route==="brain"&&App.renderBrainStats(); }
  }
};

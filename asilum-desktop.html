<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>*ASILUM — the one-stop for everything you'll ever wear</title>
<style>
:root{
  --bg:#0a0a0b; --bg2:#0e0e10; --panel:#131316; --panel2:#1a1a1e; --panel3:#212127;
  --line:#26262c; --line2:#33333b;
  --ink:#f3f0ea; --ink-dim:#9a9aa2; --ink-faint:#5c5c64;
  --red:#e5342b; --red-dim:#7a1d18; --lime:#c8ff2f; --gold:#e8c06a; --green:#5fd07a; --blue:#4d9dff;
  --serif:"Didot","Bodoni MT","Playfair Display",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,Arial,sans-serif;
  --mono:"SF Mono",Menlo,ui-monospace,monospace;
  --rail-l:250px; --rail-r:330px; --center:640px;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--red);color:#fff}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
body{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#shell{display:grid;grid-template-columns:var(--rail-l) minmax(0,var(--center)) var(--rail-r);
  justify-content:center;gap:0;height:100vh;max-width:1300px;margin:0 auto}

/* ---------------- LEFT RAIL ---------------- */
#rail-left{border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{font-family:var(--serif);font-size:30px;letter-spacing:2px;font-weight:700;padding:8px 12px 18px;line-height:1}
.brand .star{color:var(--red)}
.brand small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--ink-faint);margin-top:6px;font-weight:400}
.navitem{display:flex;align-items:center;gap:16px;padding:11px 14px;border-radius:30px;font-size:19px;color:var(--ink);transition:background .13s;position:relative;font-weight:500}
.navitem:hover{background:var(--panel2)}
.navitem.active{font-weight:800}
.navitem .ico{width:26px;text-align:center;font-size:21px}
.navitem .lbl{font-size:19px}
.navitem .ncount{position:absolute;right:14px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.navitem.active .ico{color:var(--red)}
.compose-btn{margin:16px 8px 0;background:var(--red);color:#fff;border:none;border-radius:30px;padding:15px;font-size:16px;font-weight:800;letter-spacing:.5px;transition:filter .13s}
.compose-btn:hover{filter:brightness(1.12)}
.me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:30px;transition:background .13s;cursor:pointer}
.me-chip:hover{background:var(--panel2)}
.me-chip .pfp{width:40px;height:40px;border-radius:50%;flex-shrink:0;background-size:cover;background-position:center}
.me-chip .mi-name{font-weight:700;font-size:14px}
.me-chip .mi-handle{color:var(--ink-dim);font-size:13px}

/* ---------------- CENTER ---------------- */
#center{border-right:1px solid var(--line);height:100vh;overflow-y:auto;overscroll-behavior:contain}
#center::-webkit-scrollbar{width:0}
.col-head{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:0 18px}
.col-head .ch-title{font-family:var(--serif);font-size:22px;font-weight:700;padding:15px 0 6px;display:flex;justify-content:space-between;align-items:center}
.ch-sub{font-size:12px;color:var(--ink-dim);padding-bottom:10px;margin-top:-2px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:none;color:var(--ink-dim);padding:15px 0 0;font-size:14px;font-weight:600;position:relative;height:52px}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:4px;background:var(--red);border-radius:3px}

/* product card (feed) */
.pcard{border-bottom:1px solid var(--line);display:flex;gap:14px;padding:16px 18px;transition:background .1s;cursor:pointer}
.pcard:hover{background:var(--bg2)}
.pcard .pc-img{width:120px;height:150px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden;background-size:cover;background-position:center}
.pcard .pc-img img{width:100%;height:100%;object-fit:cover}
.pcard .pc-img .src-tag{position:absolute;top:6px;left:6px;font-family:var(--mono);font-size:8px;letter-spacing:1px;padding:2px 5px;border-radius:3px;background:rgba(0,0,0,.6);color:#fff;text-transform:uppercase}
.pcard .pc-img .rare-tag{position:absolute;bottom:6px;left:6px;background:var(--red);color:#fff;font-size:8px;font-family:var(--mono);padding:2px 5px;letter-spacing:1px}
.pcard .pc-body{flex:1;min-width:0;display:flex;flex-direction:column}
.pc-brand{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.3px}
.pc-name{font-size:13px;color:var(--ink-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-tagrow{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag-chip{font-family:var(--mono);font-size:8.5px;letter-spacing:.5px;padding:2px 7px;border:1px solid var(--line2);border-radius:20px;color:var(--ink-dim);text-transform:uppercase}
.pc-why{font-family:var(--mono);font-size:9px;color:var(--ink-faint);margin-top:7px;letter-spacing:.3px;text-transform:uppercase}
.pc-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:10px}
.pc-price{font-family:var(--mono);font-size:15px;font-weight:600}
.pc-actions{margin-left:auto;display:flex;gap:6px}
.mini-btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.mini-btn:hover{border-color:var(--ink-dim)}
.mini-btn.on{color:var(--red);border-color:var(--red)}
.mini-btn.bag:hover{background:var(--red);border-color:var(--red);color:#fff}
.buy-btn{background:var(--ink);color:var(--bg);border:none;border-radius:30px;padding:0 16px;height:34px;font-size:12px;font-weight:800;letter-spacing:.5px}
.buy-btn:hover{filter:brightness(.9)}

/* tweet / post card */
.tweet{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;transition:background .1s}
.tweet:hover{background:var(--bg2)}
.tweet .tw-pfp{width:44px;height:44px;border-radius:50%;flex-shrink:0;background-size:cover;background-position:center;cursor:pointer}
.tweet .tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:center;gap:6px;font-size:14px}
.tw-name{font-weight:700}
.tw-name:hover{text-decoration:underline;cursor:pointer}
.tw-verify{color:var(--red);font-size:13px}
.tw-handle,.tw-time{color:var(--ink-dim);font-size:13px}
.tw-text{font-size:15px;line-height:1.45;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.tw-img{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);max-height:360px;background-size:cover;background-position:center;height:240px}
.tw-embed{margin-top:10px;border:1px solid var(--line);border-radius:14px;display:flex;gap:10px;padding:10px;cursor:pointer}
.tw-embed:hover{background:var(--panel)}
.tw-embed .te-img{width:66px;height:82px;border-radius:8px;background-size:cover;flex-shrink:0}
.tw-embed .te-b{font-size:13px}
.tw-embed .te-brand{font-weight:700}
.tw-embed .te-price{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-top:2px}
.tw-actions{display:flex;gap:0;margin-top:10px;max-width:400px;justify-content:space-between}
.tw-act{display:flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;background:none;border:none;padding:4px;border-radius:20px;transition:color .12s}
.tw-act:hover{color:var(--red)}
.tw-act.liked{color:var(--red)}

/* compose box (inline home) */
.compose-inline{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px}
.compose-inline .ci-pfp{width:44px;height:44px;border-radius:50%;background-size:cover;flex-shrink:0}
.compose-inline .ci-main{flex:1}
.compose-inline textarea{width:100%;background:none;border:none;color:var(--ink);font-size:19px;resize:none;font-family:inherit;min-height:52px}
.compose-inline textarea:focus{outline:none}
.compose-inline .ci-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.ci-tools{display:flex;gap:4px;color:var(--red)}
.ci-tools button{background:none;border:none;color:var(--red);font-size:18px;width:34px;height:34px;border-radius:50%}
.ci-tools button:hover{background:rgba(229,52,43,.12)}

/* ---------------- RIGHT RAIL ---------------- */
#rail-right{padding:14px 16px;height:100vh;overflow-y:auto;position:sticky;top:0}
#rail-right::-webkit-scrollbar{width:0}
.searchbox{position:sticky;top:0;background:var(--bg);padding-bottom:12px;z-index:5}
.searchbox input{width:100%;background:var(--panel2);border:1px solid transparent;border-radius:30px;padding:11px 16px 11px 40px;color:var(--ink);font-size:14px}
.searchbox input:focus{outline:none;background:var(--bg);border-color:var(--red)}
.searchbox .s-ico{position:absolute;left:14px;top:11px;color:var(--ink-dim);font-size:15px}
.rr-card{background:var(--panel);border-radius:16px;margin-bottom:16px;overflow:hidden}
.rr-card .rr-h{font-family:var(--serif);font-size:19px;font-weight:700;padding:13px 16px 8px}
.rr-row{padding:10px 16px;display:flex;align-items:center;gap:11px;transition:background .1s;cursor:pointer}
.rr-row:hover{background:var(--panel2)}
.rr-rank{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink-faint);width:22px;flex-shrink:0}
.rr-rank.top{color:var(--gold)}
.rr-av{width:40px;height:40px;border-radius:50%;background-size:cover;flex-shrink:0;background-position:center}
.rr-b{flex:1;min-width:0}
.rr-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-sub{font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-metric{font-family:var(--mono);font-size:11px;color:var(--green)}
.follow-btn{background:var(--ink);color:var(--bg);border:none;border-radius:30px;padding:6px 15px;font-size:12px;font-weight:800;flex-shrink:0}
.follow-btn.on{background:none;color:var(--ink);border:1px solid var(--line2)}
.follow-btn.on:hover{border-color:var(--red);color:var(--red)}
.rr-more{padding:11px 16px;color:var(--red);font-size:14px}
.rr-more:hover{background:var(--panel2)}
.ticker{background:var(--panel);border-radius:16px;margin-bottom:16px;padding:12px 16px}
.ticker .tk-h{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--red);margin-bottom:8px}
.tk-line{font-size:12px;color:var(--ink-dim);padding:3px 0;line-height:1.4}
.tk-line b{color:var(--ink)}

/* ---------------- generic ---------------- */
.section-label{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--ink-faint);text-transform:uppercase;padding:16px 18px 6px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:30px;padding:7px 14px;font-size:13px;color:var(--ink-dim);margin:0 8px 10px 0;cursor:pointer;transition:all .12s}
.pill:hover{border-color:var(--ink-dim)}
.pill.on{border-color:var(--red);color:var(--ink);background:rgba(229,52,43,.08)}
.btn{background:var(--red);color:#fff;border:none;border-radius:30px;padding:11px 20px;font-size:13px;font-weight:800;letter-spacing:.5px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 14px;font-size:12px}
input.field,textarea.field,select.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink);font-size:14px;font-family:inherit}
input.field:focus,textarea.field:focus{outline:none;border-color:var(--red)}
.lbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);display:block;margin:16px 0 6px}
.empty{padding:60px 30px;text-align:center;color:var(--ink-faint);font-size:14px;line-height:1.7}
.empty .big{font-family:var(--serif);font-size:24px;color:var(--ink-dim);display:block;margin-bottom:8px}

/* editorial */
.ed-hero{margin:0;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.ed-hero .eh-visual{height:280px;background-size:cover;background-position:center;position:relative}
.ed-hero .eh-grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,11,.95) 0%,transparent 60%)}
.ed-hero .eh-text{position:absolute;bottom:0;left:0;right:0;padding:22px}
.ed-hero .eh-k{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--red);margin-bottom:8px}
.ed-hero .eh-t{font-family:var(--serif);font-size:30px;line-height:1.15;font-weight:700}
.ed-hero .eh-d{font-size:13px;color:var(--ink-dim);margin-top:8px;max-width:520px}
.ed-row{display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.ed-row:hover{background:var(--bg2)}
.ed-row .er-img{width:130px;height:90px;border-radius:8px;background-size:cover;flex-shrink:0}
.ed-row .er-k{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--red)}
.ed-row .er-t{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:5px;line-height:1.2}
.ed-row .er-m{font-size:11px;color:var(--ink-faint);margin-top:6px;font-family:var(--mono)}

/* brain */
#brainWrap{position:relative;background:radial-gradient(ellipse at 50% 35%,#141419,#0a0a0b 72%)}
#brainCanvas{display:block;width:100%;cursor:grab}
#brainCanvas:active{cursor:grabbing}
.brain-legend{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:10px;line-height:1.9;color:var(--ink-dim);pointer-events:none}
.brain-legend .w{color:#fff}.brain-legend .r{color:var(--red)}
.bstat{display:flex;align-items:center;gap:12px;padding:8px 18px;border-bottom:1px solid var(--panel2)}
.bstat .k{font-size:13px;width:130px}
.bstat .bar{flex:1;height:4px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bstat .bar i{display:block;height:100%;background:var(--ink)}
.bstat.neg .bar i{background:var(--red-dim)}
.bstat .v{font-family:var(--mono);font-size:11px;color:var(--ink-dim);width:46px;text-align:right}

/* modal */
.modal{position:fixed;inset:0;background:rgba(6,6,8,.72);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .sheet{background:var(--bg);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;position:relative}
.modal .m-close{position:absolute;top:14px;right:14px;background:var(--panel2);border:none;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;z-index:2}
.modal .m-pad{padding:24px}
.m-title{font-family:var(--serif);font-size:26px;font-weight:700;margin-bottom:4px}
.m-sub{color:var(--ink-dim);font-size:13px;margin-bottom:14px}

/* bag drawer */
#bagDrawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--bg);border-left:1px solid var(--line2);z-index:180;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#bagDrawer.open{transform:translateX(0)}
#bagDrawer .bd-head{padding:18px;font-family:var(--serif);font-size:24px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#bagDrawer .bd-items{flex:1;overflow-y:auto}
.bd-item{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--panel2);align-items:center}
.bd-item .bi-img{width:52px;height:66px;border-radius:6px;background-size:cover;flex-shrink:0}
.bd-item .bi-src{font-family:var(--mono);font-size:8px;color:var(--ink-faint);letter-spacing:1px}
.bd-item .rm{margin-left:auto;background:none;border:none;color:var(--ink-faint);font-size:16px}
#bagDrawer .bd-foot{border-top:1px solid var(--line);padding:16px 18px}
.bd-total{display:flex;justify-content:space-between;font-family:var(--mono);font-size:16px;margin-bottom:12px;font-weight:600}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:30px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast-partner{background:var(--panel3);color:var(--ink);border:1px solid var(--line2)}

/* ticket flow */
.tkt-step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tkt-num{width:28px;height:28px;border-radius:50%;background:var(--panel3);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;flex-shrink:0;font-weight:700}
.tkt-step.done .tkt-num{background:var(--green);color:#000}
.tkt-step.active .tkt-num{background:var(--red);color:#fff}
.tkt-b .tk-t{font-weight:700;font-size:14px}
.tkt-b .tk-d{font-size:12px;color:var(--ink-dim);margin-top:2px}

/* profile */
.pf-banner{height:200px;background-size:cover;background-position:center;position:relative}
.pf-av{width:120px;height:120px;border-radius:50%;border:4px solid var(--bg);background-size:cover;position:absolute;bottom:-58px;left:18px;background-position:center}
.pf-body{padding:70px 18px 0}
.pf-name{font-family:var(--serif);font-size:24px;font-weight:700}
.pf-handle{color:var(--ink-dim);font-size:14px}
.pf-bio{font-size:14px;margin:10px 0;line-height:1.5}
.pf-stats{display:flex;gap:20px;font-size:13px;color:var(--ink-dim);margin-bottom:6px}
.pf-stats b{color:var(--ink)}
.badge-src{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:20px;text-transform:uppercase}

/* observation banner */
.obs-banner{background:linear-gradient(90deg,rgba(229,52,43,.12),transparent);border:1px solid var(--red-dim);border-radius:14px;margin:14px 18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.obs-banner .ob-t{font-weight:700;font-size:14px}
.obs-banner .ob-d{font-size:12px;color:var(--ink-dim);margin-top:2px}

/* small helpers */
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.gap8{gap:8px}.gap12{gap:12px}
.mono{font-family:var(--mono)}.dim{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.hide{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){ :root{--rail-r:0px} #rail-right{display:none} #shell{grid-template-columns:var(--rail-l) minmax(0,1fr)} }
@media(max-width:720px){ :root{--rail-l:68px} .navitem .lbl,.brand small,.me-chip .mi-name,.me-chip .mi-handle{display:none} .compose-btn{font-size:0;padding:14px} .compose-btn::after{content:"+";font-size:22px} }
</style>
</head>
<body>
<div id="shell">
  <nav id="rail-left">
    <div class="brand"><span class="star">*</span>ASILUM<small>THE MAGAZINE THAT KNOWS YOU</small></div>
    <div id="nav"></div>
    <button class="compose-btn" id="composeBtn">Post</button>
    <div class="me-chip" id="meChip" onclick="App.go('profile')"></div>
  </nav>

  <main id="center"></main>

  <aside id="rail-right"></aside>
</div>

<div id="bagDrawer">
  <div class="bd-head">Bag <button class="mini-btn" onclick="App.closeBag()">✕</button></div>
  <div class="bd-items" id="bagItems"></div>
  <div class="bd-foot">
    <div class="flex between" style="font-size:12px;color:var(--ink-dim);padding:2px 0"><span>Subtotal</span><span class="mono" id="bagSub">$0</span></div>
    <div class="flex between" style="font-size:12px;color:var(--ink-dim);padding:2px 0"><span>ASILUM service fee (1%)</span><span class="mono" id="bagFee">$0.00</span></div>

<script>
/* =====================================================================
   ASILUM — TRANSACTION TICKET ENGINE  (UMD: Node + browser)

   The order pipeline behind "buy a partner product without leaving ASILUM."
   Per ticket, the state machine runs:

     created
       → consent        (user accepted the account-creation disclaimer)
       → account_check  (does the user already have a linked partner account?)
       → account_provision  (if not: partner ACCOUNT-CREATE adapter → save a
                             credential in the user's settings, clearly labeled
                             e.g. "SSENSE account")
       → order_placed   (partner COMMERCE adapter places the order on behalf)
       → confirmed       (partner acknowledges + charges)
       → tracking        (partner returns carrier + tracking number)
       → fulfilled       (terminal success)
     any hard failure → ret/backoff → dead_letter (terminal failure)

   Designed for throughput: a bounded queue, a fixed worker pool (concurrency),
   a per-partner token-bucket rate limiter (respects partner API limits),
   idempotency keys (no double-charge on retry/duplicate submit), exponential
   backoff with jitter, and a dead-letter queue. Everything is injected
   (store, transport, clock, config) so the SAME engine runs live in the
   browser and headless in the load-test harness.

   PARTNER BOUNDARY: `transport.ensureAccount` / `placeOrder` / `getTracking`
   are the seams that call real partner APIs. They only run "live" when the
   partner is authorized; otherwise a simulated transport stands in. Nothing
   here scrapes or touches a partner without an authorized API.
   ===================================================================== */

function createTicketEngine(deps) {
  const store = deps.store;               // { get(k), set(k,v) }
  const transport = deps.transport;       // partner adapters (see below)
  const clock = deps.clock || {           // injectable for virtual-time tests
    now: () => Date.now(),
    sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
  };
  const cfg = Object.assign({
    workers: 8,                 // concurrent in-flight tickets per node
    maxQueue: 100000,           // backpressure ceiling
    maxAttempts: 5,             // per-stage retry budget
    baseBackoffMs: 400,
    maxBackoffMs: 15000,
    // per-partner request budget (token bucket): {capacity, refillPerSec}
    rateLimits: {},             // e.g. { SSENSE:{capacity:20, refillPerSec:10} }
    defaultRate: { capacity: 30, refillPerSec: 20 },
    dedupeWindowMs: 5 * 60 * 1000,  // same (user,item) inside window = idempotent
  }, deps.config || {});

  // ---- persistent-ish collections (store-backed so the browser keeps them) --
  const K = { tickets: "tk_tickets", dead: "tk_dead", idem: "tk_idem", accts: "tk_accounts", metrics: "tk_metrics" };
  const load = (k, d) => { const v = store.get(k); return v == null ? d : v; };
  const tickets = load(K.tickets, {});   // id -> ticket
  const dead = load(K.dead, {});         // id -> ticket
  const idem = load(K.idem, {});         // idemKey -> ticketId
  const accounts = load(K.accounts, {}); // userId -> { SOURCE: {accountId, credentialRef, label, createdAt} }
  const persist = () => { store.set(K.tickets, tickets); store.set(K.dead, dead); store.set(K.idem, idem); store.set(K.accounts, accounts); };

  // ---- metrics ------------------------------------------------------------
  const metrics = {
    enqueued: 0, completed: 0, failed: 0, retries: 0, duplicatesCollapsed: 0,
    accountsProvisioned: 0, accountsReused: 0, rateLimitWaits: 0,
    latencies: [],            // end-to-end ms (virtual) for completed tickets
    stageLatencies: {},       // stage -> [ms]
    queueHighWater: 0,
    inflight: 0,
  };
  const recStage = (s, ms) => { (metrics.stageLatencies[s] = metrics.stageLatencies[s] || []).push(ms); };

  // ---- token-bucket rate limiter per partner ------------------------------
  const buckets = {};
  function bucketFor(src) {
    if (!buckets[src]) {
      const r = cfg.rateLimits[src] || cfg.defaultRate;
      buckets[src] = { tokens: r.capacity, capacity: r.capacity, refillPerSec: r.refillPerSec, last: clock.now() };
    }
    return buckets[src];
  }
  async function takeToken(src) {
    const b = bucketFor(src);
    for (;;) {
      const now = clock.now();
      const refill = ((now - b.last) / 1000) * b.refillPerSec;
      if (refill > 0) { b.tokens = Math.min(b.capacity, b.tokens + refill); b.last = now; }
      if (b.tokens >= 1) { b.tokens -= 1; return; }
      metrics.rateLimitWaits++;
      const need = (1 - b.tokens) / b.refillPerSec * 1000;
      await clock.sleep(Math.max(5, need));
    }
  }

  // ---- queue + workers ----------------------------------------------------
  const queue = [];             // ticket ids waiting for a worker
  const provisioning = {};      // (userId|source) -> in-flight provision promise (dedupe lock)
  let running = false, waiters = [];
  const wakeWorker = () => { const w = waiters.shift(); if (w) w(); };

  function idemKeyFor(o) {
    const bucket = Math.floor(clock.now() / cfg.dedupeWindowMs);
    return `${o.userId}|${o.source}|${o.itemId}|${bucket}`;
  }

  // Public: submit an order → returns the ticket (idempotent within window).
  function enqueue(order) {
    if (queue.length >= cfg.maxQueue) throw new Error("QUEUE_FULL");   // backpressure
    const key = idemKeyFor(order);
    if (idem[key] && tickets[idem[key]] && tickets[idem[key]].status !== "dead_letter") {
      metrics.duplicatesCollapsed++;
      return tickets[idem[key]];               // collapse duplicate submit
    }
    const id = "TKT-" + order.source + "-" + (clock.now()).toString(36).toUpperCase() + "-" + Math.random().toString(36).slice(2, 6);
    const t = {
      id, userId: order.userId, source: order.source, itemId: order.itemId,
      brand: order.brand, name: order.name, price: order.price,
      userInfo: order.userInfo,                // name/email/address used to provision
      consent: !!order.consent,                // disclaimer accepted
      status: "created", attempts: 0, stage: "created",
      createdAt: clock.now(), history: [{ s: "created", t: clock.now() }],
      account: null, orderId: null, tracking: null, error: null,
    };
    tickets[id] = t; idem[key] = id; metrics.enqueued++;
    queue.push(id);
    metrics.queueHighWater = Math.max(metrics.queueHighWater, queue.length);
    wakeWorker();
    return t;
  }

  function advance(t, stage, note) {
    t.stage = stage; t.status = stage; t.history.push({ s: stage, t: clock.now(), note });
    if (deps.onUpdate) deps.onUpdate(t);
  }

  // Run one stage with retry/backoff. fn returns a value or throws.
  async function withRetry(t, stageName, fn) {
    let attempt = 0;
    for (;;) {
      const s0 = clock.now();
      try {
        const r = await fn();
        recStage(stageName, clock.now() - s0);
        return r;
      } catch (e) {
        attempt++; t.attempts++; metrics.retries++;
        if (e && e.fatal) throw e;                      // non-retryable
        if (attempt >= cfg.maxAttempts) throw Object.assign(new Error("MAX_RETRIES:" + stageName + ":" + (e.message||e)), { stage: stageName });
        const back = Math.min(cfg.maxBackoffMs, cfg.baseBackoffMs * 2 ** (attempt - 1));
        const jitter = back * (0.5 + Math.random() * 0.5);
        await clock.sleep(jitter);
      }
    }
  }

  // The core pipeline for one ticket.
  async function process(t) {
    metrics.inflight++;
    try {
      // 1) consent gate — the disclaimer must have been accepted upstream
      if (!t.consent) throw Object.assign(new Error("NO_CONSENT"), { fatal: true });
      advance(t, "consent");

      // 2) account check / provision — with a per-(user,source) lock so two
      // concurrent orders can NEVER create two partner accounts for one user.
      advance(t, "account_check");
      const userAccts = accounts[t.userId] || (accounts[t.userId] = {});
      if (userAccts[t.source]) {
        t.account = userAccts[t.source]; metrics.accountsReused++;
      } else {
        const lockKey = t.userId + "|" + t.source;
        if (provisioning[lockKey]) {
          // another ticket is already creating this account — wait, then reuse
          t.account = await provisioning[lockKey]; metrics.accountsReused++;
        } else {
          advance(t, "account_provision");
          let resolveLock; provisioning[lockKey] = new Promise((r) => (resolveLock = r));
          try {
            await takeToken(t.source);
            const acct = await withRetry(t, "account_provision", () => transport.ensureAccount(t.source, t.userInfo));
            userAccts[t.source] = {                 // saved in user settings, labeled
              accountId: acct.accountId, credentialRef: acct.credentialRef,
              label: "*" + labelFor(t.source) + " account", createdAt: clock.now(),
              provisionedBy: "ASILUM", email: (t.userInfo && t.userInfo.email) || null,
            };
            t.account = userAccts[t.source]; metrics.accountsProvisioned++;
            resolveLock(t.account);
          } catch (e) {
            resolveLock(null); throw e;
          } finally { delete provisioning[lockKey]; }
        }
      }

      // 3) place order on behalf
      advance(t, "order_placed");
      await takeToken(t.source);
      const order = await withRetry(t, "order_placed", () => transport.placeOrder(t.source, t.account, { itemId: t.itemId, price: t.price, name: t.name, brand: t.brand }));
      t.orderId = order.orderId;

      // 4) confirmation (partner charges + accepts)
      advance(t, "confirmed", order.confirmation);

      // 5) tracking
      advance(t, "tracking");
      await takeToken(t.source);
      const trk = await withRetry(t, "tracking", () => transport.getTracking(t.source, t.orderId));
      t.tracking = trk;

      // terminal success
      advance(t, "fulfilled");
      metrics.completed++;
      metrics.latencies.push(clock.now() - t.createdAt);
    } catch (e) {
      t.error = String(e.message || e); t.failedStage = e.stage || t.stage;
      advance(t, "dead_letter", t.error);
      dead[t.id] = t; metrics.failed++;
    } finally {
      metrics.inflight--;
      persist();
    }
  }

  // Worker loop: pull ids, respect concurrency (workers = parallelism).
  async function worker() {
    for (;;) {
      if (!running) return;
      const id = queue.shift();
      if (id == null) { await new Promise((res) => waiters.push(res)); continue; }
      await process(tickets[id]);
    }
  }

  function start() {
    if (running) return; running = true;
    for (let i = 0; i < cfg.workers; i++) worker();
  }
  function stop() { running = false; waiters.splice(0).forEach((w) => w()); }

  // For tests: resolve when the queue is fully drained and nothing is inflight.
  async function drain() {
    for (;;) {
      if (queue.length === 0 && metrics.inflight === 0) return;
      await clock.sleep(1);
    }
  }

  function labelFor(src) { return (deps.sourceLabels && deps.sourceLabels[src]) || src; }
  function accountsOf(userId) { return accounts[userId] || {}; }
  function allAccounts() { return accounts; }
  function removeAccount(userId, source){ if(accounts[userId]){ delete accounts[userId][source]; persist(); } }
  function ticketsOf(userId) { return Object.values(tickets).filter((t) => t.userId === userId).sort((a, b) => b.createdAt - a.createdAt); }
  function snapshot() {
    const lat = metrics.latencies.slice().sort((a, b) => a - b);
    const pct = (p) => lat.length ? lat[Math.min(lat.length - 1, Math.floor(lat.length * p))] : 0;
    const stageP = {};
    for (const s in metrics.stageLatencies) { const a = metrics.stageLatencies[s].slice().sort((x, y) => x - y); stageP[s] = { p50: a[a.length * 0.5 | 0], p95: a[a.length * 0.95 | 0], p99: a[Math.min(a.length - 1, a.length * 0.99 | 0)] }; }
    return {
      enqueued: metrics.enqueued, completed: metrics.completed, failed: metrics.failed,
      retries: metrics.retries, duplicatesCollapsed: metrics.duplicatesCollapsed,
      accountsProvisioned: metrics.accountsProvisioned, accountsReused: metrics.accountsReused,
      rateLimitWaits: metrics.rateLimitWaits, queueHighWater: metrics.queueHighWater,
      inflight: metrics.inflight, queueDepth: queue.length,
      e2e: { p50: pct(0.5), p95: pct(0.95), p99: pct(0.99), max: lat[lat.length - 1] || 0 },
      stageP,
    };
  }

  return { enqueue, start, stop, drain, snapshot, accountsOf, allAccounts, removeAccount, ticketsOf, deadLetter: () => Object.values(dead), _metrics: metrics, _cfg: cfg, _queue: queue, _tickets: tickets };
}

/* =====================================================================
   BROWSER WIRING for the ticket engine.
   Builds the partner transport (simulated until each partner is authorized)
   and a factory the app calls in boot() to spin up the engine.
   ===================================================================== */

/* Partner transport — the seam where real partner APIs plug in. Each method
   checks SOURCES[src].authorized: authorized partners would hit the live
   adapter; everyone else runs the simulated transport (clearly flagged). */
function BrowserPartnerTransport(){
  const simLatency = (a,b)=> new Promise(r=> setTimeout(r, a+Math.random()*(b-a)));
  return {
    async ensureAccount(src, userInfo){
      // LIVE PATH (authorized): call partner Account-Create API here.
      // if(SOURCES[src].authorized) return await realCreateAccount(src, userInfo);
      await simLatency(300, 900);
      if(Math.random()<0.03) throw new Error(src+"_acct_502");           // transient
      return { accountId: src+"_"+Math.random().toString(36).slice(2,10),
               credentialRef: "cred_"+Math.random().toString(36).slice(2,12) };
    },
    async placeOrder(src, account, item){
      // LIVE PATH: partner Commerce API — place order on the user's behalf.
      await simLatency(200, 700);
      if(Math.random()<0.03) throw new Error(src+"_order_502");
      return { orderId: src+"_ORD_"+Math.random().toString(36).slice(2,10), confirmation:"charged $"+item.price };
    },
    async getTracking(src, orderId){
      // LIVE PATH: partner fulfillment webhook / tracking endpoint.
      await simLatency(150, 600);
      if(Math.random()<0.03) throw new Error(src+"_track_502");
      const carrier = ["DHL","UPS","FedEx","USPS"][Math.random()*4|0];
      return { carrier, trackingNo:"1Z"+Math.random().toString(36).slice(2,12).toUpperCase(),
               url:"https://track.example/"+orderId, eta: 2+ (Math.random()*6|0)+" days" };
    },
  };
}

/* Factory the app calls once, in boot(). Uses the app's Store for persistence
   so tickets + provisioned accounts survive reloads. */
function makeAsilumTicketEngine(){
  const labels = {}; SOURCE_KEYS.forEach(s=> labels[s]=(SOURCES[s].domain||s.toLowerCase()).replace(/\.com$/,""));
  return createTicketEngine({
    store: {
      get:(k)=> Store.get("eng_"+k),
      set:(k,v)=> Store.set("eng_"+k, v),
    },
    transport: BrowserPartnerTransport(),
    sourceLabels: labels,
    config: {
      workers: 6,                       // browser: modest concurrency (server scales out)
      maxQueue: 5000,
      maxAttempts: 6, baseBackoffMs: 500, maxBackoffMs: 8000,
      rateLimits: SOURCE_KEYS.reduce((m,s)=>{ m[s]={capacity:20, refillPerSec:12}; return m; },{}),
    },
    onUpdate: (t)=> { App.onTicketUpdate && App.onTicketUpdate(t); },
  });
}

function resolveMoodToken(tok){
  const t=tok.trim().toLowerCase(); if(!t) return null;
  if(LEXICON[t]) return {...LEXICON[t]};
  const brand=BRANDS.find(b=>b[0].toLowerCase()===t||b[0].toLowerCase().includes(t)&&t.length>3);
  if(brand){ const v={}; brand[1].forEach((tg,i)=>v[tg]=i===0?.7:.5); return v; }
  const tag=TAGS.find(x=>x.toLowerCase()===t||x.toLowerCase().replace("-","")===t.replace("-",""));

/* whole moodboard text → averaged vector + which tokens hit */
function moodVector(text){
  const tokens=String(text||"").toLowerCase().split(/[,\n]+|\s{2,}|\s(?=\S)/).map(s=>s.trim()).filter(Boolean);
  const v={}; const hits=[]; const misses=[];
  tokens.forEach(tok=>{ const one=resolveMoodToken(tok);
    if(one){ hits.push(tok); for(const k in one) v[k]=(v[k]||0)+one[k]; } else misses.push(tok); });
  if(hits.length) for(const k in v) v[k]=v[k]/Math.sqrt(hits.length);
  return {vec:v,hits,misses};
}

const Brain = {

  topTags(k=3){ return Object.entries(this.vec).sort((a,b)=>b[1]-a[1]).slice(0,k); },
  explore(){ const top=this.topTags(2); const pool=new Set();
    (top.length?top:[["MINIMAL",0]]).forEach(([t])=> Object.keys(TAG_AFFINITY[t]||{}).forEach(a=>{ if((this.vec[a]||0)<.15) pool.add(a); }));
    const arr=[...pool]; return arr.length?arr[Math.floor(rng()*arr.length)]:null; },
  /* ============ THE FIVE BRIDGES (mirrors asilum-brain lib/brain/bridges.js) ============
     ALPHA  — direct content match: item tag-vector vs learned profile (cosine-ish)
     BETA   — behavioral proxy: how strongly the profile rates the item's DOMINANT trait
     EPSILON— exploration wildcard: adjacency-bridge tags the user hasn't developed yet
     DELTA  — variety/novelty: unseen items outrank fatigued ones
     AD     — sponsored slot (none seeded; hook is live)
     Blend: 40/25/15/10/10 base → 30/25/20/15/10 when epsilon is active (toggle or
     auto-fired by fatigue, same as the repo). Every ranked item carries _parts so
     the UI can say WHICH bridge surfaced it. */
  SPLIT_BASE:{alpha:40,beta:25,epsilon:15,delta:10,ad:10},
  SPLIT_EPS:{alpha:30,beta:25,epsilon:20,delta:15,ad:10},
  domTag(it){ return Object.entries(it.tags||{}).sort((a,b)=>b[1]-a[1])[0]?.[0]||null; },
  bridges(it,seen,expTag){
    // alpha: normalized dot product
    let dot=0,na=0,nb=0; for(const t of TAGS){ const a=this.vec[t]||0,b=it.tags[t]||0; dot+=a*b; na+=a*a; nb+=b*b; }
    const alpha=(na&&nb)?Math.max(dot/(Math.sqrt(na)*Math.sqrt(nb)),0):0;
    const dom=this.domTag(it);
    const beta=Math.max(dom?(this.vec[dom]||0):0,0);
    const epsilon=(expTag&&(it.tags[expTag]||0)>.35)?it.tags[expTag]:0;
    const delta=1-Math.min(seen[it.id]||0,5)/5;
    const ad=it.sponsored?1:0;
    return {alpha,beta,epsilon,delta,ad};
  },
  blended(parts,split){ return (parts.alpha*split.alpha+parts.beta*split.beta+parts.epsilon*split.epsilon+parts.delta*split.delta+parts.ad*split.ad)/100; },
  BRIDGE_REASON:{alpha:"MATCHES YOUR TASTE",beta:"LEANS INTO A TRAIT YOU LOVE",epsilon:"A WILDCARD FOR YOU",delta:"A BIT OF VARIETY",ad:"SPONSORED"},
  winningBridge(parts,split){ let bk=null,bv=-1; for(const k in parts){ const v=parts[k]*(split[k]/100); if(v>bv){bv=v;bk=k;} } return bk; },
  why(item){
    if(item._parts){ const b=this.winningBridge(item._parts,item._split||this.SPLIT_BASE);
      const dom=this.domTag(item); const conv=dom&&(this.vec[dom]||0)>.08?` · ${dom}`:"";
      return (this.BRIDGE_REASON[b]||"CALIBRATING")+conv; }
    const cs=this.conceptsOf(item).filter(t=>(this.vec[t]||0)>.08).sort((a,b)=>this.vec[b]-this.vec[a]).slice(0,2);
    if(!cs.length){ const e=this.explore(); return item.tags&&this.conceptsOf(item).includes(e)?"EXPLORING · "+e:"CALIBRATING"; }
    return "YOU RATE "+cs.join(" + "); },

  /* feed rank: five-bridge blended score + diversity guards + ε-injection */
  rank(pool,count=40){
    const seen=Store.get("seen")||{};
    const epsActive=(this.meta.fatigue||0)>=3;          // auto-epsilon on boredom, like the repo
    const split=epsActive?this.SPLIT_EPS:this.SPLIT_BASE;
    const expTag=this.explore();
    const scored=pool.map(it=>{ const parts=this.bridges(it,seen,expTag);
      it._parts=parts; it._split=split;
      return {it,s:this.blended(parts,split)+rng()*.03}; });
    scored.sort((a,b)=>b.s-a.s);
    const domTag=it=>Object.entries(it.tags).sort((a,b)=>b[1]-a[1])[0][0];
    const out=[],chosen=new Set(),ub={},ut={},us={}; const exp=this.explore();
    // pass 1: taste-first with soft diversity caps (dominant tag only)
    for(const {it} of scored){ if(out.length>=count) break;
      const bp=ub[it.brand]||0, tp=ut[domTag(it)]||0, sp=us[it.source]||0;
      if(bp>=3||tp>=Math.ceil(count/4)||sp>=Math.ceil(count/2)) continue;
      out.push(it); chosen.add(it.id); ub[it.brand]=bp+1; us[it.source]=sp+1; ut[domTag(it)]=tp+1;
    }
    // pass 2: guarantee count is met even if caps bit (large pools should never starve)
    if(out.length<count){ for(const {it} of scored){ if(out.length>=count) break; if(chosen.has(it.id)) continue; out.push(it); chosen.add(it.id); } }
    // ε-exploration injection
    if(exp){ const ex=pool.filter(it=>it.tags[exp]>.4&&!chosen.has(it.id));
      for(let i=6;i<out.length&&ex.length;i+=7){ const p=ex.shift(); out.splice(i,0,p); out.pop(); } }
    out.forEach(it=> seen[it.id]=(seen[it.id]||0)+1); Store.set("seen",seen);
    return out;
  },
};
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* =====================================================================
   STYLIST — cross-source outfit engine. Pulls pieces from ANY marketplace
   and assembles coherent, taste-matched fits with a confidence score.
   ===================================================================== */
const Stylist = {
  colorGroup(c){ const g={dark:["black","charcoal","washed-black","navy","forest"],earth:["olive","tan","brown","cream"],
    denim:["indigo"],light:["ivory","grey","silver","crimson"]}; for(const k in g) if(g[k].includes(c)) return k; return "other"; },
  aesCompat(a,b){ let best=0; for(const x in a){ if(a[x]<.2)continue; for(const y in b){ if(b[y]<.2)continue;
    best=Math.max(best, x===y?1:(TAG_AFFINITY[x]&&TAG_AFFINITY[x][y]||TAG_AFFINITY[y]&&TAG_AFFINITY[y][x]||.1)); } } return best; },
  pair(i,j){ const aes=this.aesCompat(i.tags,j.tags); const form=1-Math.min(Math.abs(i.price>800?2:i.price>250?1:0-(j.price>800?2:j.price>250?1:0)),3)/3;
    const col=this.colorGroup(i.color)===this.colorGroup(j.color)?.8:(this.colorGroup(i.color)==="dark"||this.colorGroup(j.color)==="dark"?.7:.5);
    const era=1-Math.min(Math.abs(i.era.year-j.era.year),40)/40;
    return aes*.5+col*.22+era*.18+form*.1; },
  build(pool,anchor,withOuter=true){
    const bySlot=s=>pool.filter(x=>x.slot===s);
    const chosen=anchor?[anchor]:[]; const filled=new Set(chosen.map(x=>x.slot));
    const want=["top","bottom","foot"]; if(withOuter) want.unshift("outer"); want.push("acc");
    let cohS=0,cohN=0;
    for(const slot of want){ if(filled.has(slot)) continue;
      const cands=bySlot(slot); if(!cands.length) continue;
      let best=null;
      for(const c of cands){ const taste=Brain.score(c); const coh=chosen.length?chosen.reduce((s,x)=>s+this.pair(c,x),0)/chosen.length:.6;
        const sc=taste*.42+coh*.5+rng()*.06; if(!best||sc>best.sc) best={c,sc,coh}; }
      if(best){ chosen.push(best.c); filled.add(slot); cohS+=best.coh; cohN++; } }
    const taste=chosen.reduce((s,c)=>s+Math.max(Brain.score(c),0),0)/chosen.length;
    const coh=cohN?cohS/cohN:.5; const raw=coh*.58+taste*.42;
    const conf=Math.round(clamp(58+raw*38+Math.min(Brain.meta.events,400)/50,58,99));
    const dom=Object.entries(chosen.reduce((v,c)=>{for(const t in c.tags)v[t]=(v[t]||0)+c.tags[t];return v;},{})).sort((a,b)=>b[1]-a[1])[0]?.[0]||"MINIMAL";
    const sources=[...new Set(chosen.map(c=>c.source))];
    return {items:chosen,conf,dom,sources,total:chosen.reduce((s,c)=>s+c.price,0),
      title:pick(OUTFIT_NAMES[dom]||["Untitled Study"]),
      why:`coherence ${coh.toFixed(2)} · taste ${taste.toFixed(2)} · ${sources.length} source${sources.length>1?"s":""}`};
  },
  slate(pool,n=3,anchor=null){ const out=[],usedDom=new Set();
    for(let i=0;i<n*2&&out.length<n;i++){ const f=this.build(pool,i===0?anchor:null,i%3!==2);
      if(f.items.length<3) continue; if(usedDom.has(f.dom)&&i<n) continue; usedDom.add(f.dom); out.push(f); } return out; },
};
const OUTFIT_NAMES={'AVANT-GARDE':["Deconstruction No.4","Wrong On Purpose","The Argument"],'SEDUCTIVE':["After Dark","Slip & Structure","The Invitation"],
  'STATEMENT':["Loud On Purpose","Front Row Fiction","The Entrance"],'TAILORED':["Soft Power","The Appointment","Drape Decision"],
  'ARCHIVAL':["The Provenance","Season Ghost","Paper Tag"],'MINIMAL':["Quiet Hours","The Reduction","Beige Cathedral"],
  'UTILITARIAN':["Second Shift","Field Logic","Union Break"],'STREETWEAR':["Queue Theory","Drop Day","Corner Office"],
  'GORP':["Trailhead Fiction","City Summit","Shell Doctrine"],'INDEPENDENT':["The Outsider","Small Batch","Off-Grid"]};

/* =====================================================================
   BACKGROUND OBSERVATION — opt-in, ON-DEVICE only.
   Simulates the consented signal collector that (with a real browser
   extension) would note aesthetics the user lingers on elsewhere and
   feed them to the brain. No data leaves the device; explicit toggle.
   ===================================================================== */
const Observer = {
  enabled(){ return !!Store.get("obsEnabled"); },
  enable(v){ Store.set("obsEnabled",!!v); if(v) this.tick(); },
  timer:null,
  start(){ if(this.timer) clearInterval(this.timer); this.timer=setInterval(()=>this.tick(),12000); },
  tick(){ if(!this.enabled()) return;
    // simulate: pick an aesthetic weighted toward current taste's neighbors
    const t=Brain.explore()||pick(TAGS);
    Brain.signal("observe",{tags:[t]},1);
    App.pushTicker(`observed interest in <b>${t}</b> on an external tab`);
  }
};
</script>
<script>
/* =====================================================================
   PARTNER LAYER — the "layered semi-hyperlink" + ticket system.

   Concept (as specced): a user sees an item from e.g. SSENSE inside
   ASILUM. Without leaving the app they (1) link/create a partner account,
   (2) buy in-app, (3) ASILUM emits a PURCHASE TICKET to the partner which
   fulfills the order. Money and fulfillment stay with the partner; ASILUM
   is the aggregating storefront + router.

   IMPORTANT — this framework is built and wired for all 7 partners but runs
   on a SIMULATED transport until a real partnership + API credentials exist.
   Each connector declares the exact real-world integration path it will use
   (Affiliate/Commerce API, OAuth account-link, order webhook). Nothing here
   scrapes any site; adapters call documented partner endpoints only once
   `authorized` flips true and credentials are supplied. This respects the
   project's hard rule: legitimate sources only, never scraping.
   ===================================================================== */

const PartnerLink = {
  // per-partner integration contract (what gets wired when authorized)
  contract:{
    SSENSE:  {account:"OAuth2 (Authorization Code)", commerce:"SSENSE Partner Commerce API", order:"POST /orders + webhook", note:"Retail — 1P inventory, real-time stock."},
    FARFETCH:{account:"OAuth2", commerce:"Farfetch Marketplace API (FMA)", order:"POST /orders/checkout", note:"Boutique-federated inventory."},
    LOWHEADS:{account:"OAuth2 / magic-link", commerce:"Lowheads Seller API", order:"POST /purchase-intents", note:"P2P — seller-confirmed."},
    EBAY:    {account:"eBay OAuth (user token)", commerce:"eBay Browse + Buy APIs", order:"createPurchaseOrder", note:"Authorized (dev keys pending)."},
    DEPOP:   {account:"OAuth2", commerce:"Depop Public API (partner)", order:"POST /transactions", note:"P2P — seller ships."},
    GRAILED: {account:"OAuth2", commerce:"Grailed Partner API", order:"offer/buy-now intent", note:"P2P — offer or buy-now."},
    REALREAL:{account:"OAuth2", commerce:"TRR Consignment API", order:"POST /orders", note:"Authenticated consignment — 1 of 1."},
  },
  linked(){ return Store.get("partnerLinks")||{}; },
  isLinked(src){ return src==="ASILUM" || !!this.linked()[src]; },
  link(src,email){ const l=this.linked(); l[src]={email,linkedAt:Date.now(),token:"sim_"+Math.random().toString(36).slice(2,10)}; Store.set("partnerLinks",l); },
  unlink(src){ const l=this.linked(); delete l[src]; Store.set("partnerLinks",l); },

  tickets(){ return Store.get("tickets")||[]; },
  // SIMULATED partner call — replace body with real adapter fetch when authorized
  async emitTicket(item, linkedEmail){
    const src=SOURCES[item.source];
    const ticket={
      id:"TKT-"+item.source+"-"+Date.now().toString(36).toUpperCase(),
      source:item.source, itemId:item.id, brand:item.brand, name:item.name, price:item.price,
      buyerEmail:linkedEmail, status:"routing", createdAt:Date.now(),
      transport: src.authorized ? "live-adapter" : "simulated",
    };
    const list=this.tickets(); list.unshift(ticket); Store.set("tickets",list);
    // simulate partner acknowledging + fulfilling
    await sleep(700); this._advance(ticket.id,"accepted","Partner accepted the purchase ticket");
    await sleep(900); this._advance(ticket.id,"confirmed","Payment authorized · order placed with "+src.label);
    await sleep(700); this._advance(ticket.id,"fulfilling","Seller/warehouse preparing shipment");
    return ticket;
  },
  _advance(id,status,note){ const list=this.tickets(); const t=list.find(x=>x.id===id); if(!t) return;
    t.status=status; t.note=note; t.updatedAt=Date.now(); Store.set("tickets",list);
    App.onTicketUpdate && App.onTicketUpdate(t); },
};
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* =====================================================================
   BUY FLOW (the "layered semi-hyperlink" UX):
   click Buy on a partner item →
     if account not linked → account-link sheet (create/link in-app) →
     confirm purchase sheet → emit ticket → live ticket tracker.

const BuyFlow = {
  start(item){
    if(!App.user){ App.toast("Sign in to buy"); App.go("profile"); return; }
    if(item.source==="ASILUM"){ return this.confirm(item); }
    return this.confirm(item);
  },
  // Confirm the purchase; if we don't yet have a partner account for this user,

  confirm(item){

    const c=PartnerLink.contract[item.source]||{};
    App.modal(`
      <div class="m-title">${item.source==="ASILUM"?"Confirm purchase":"Buy on "+src.label+" — without leaving ASILUM"}</div>
      <div class="m-sub">${src.kind==="first-party"?"Fulfilled by ASILUM Vault.":"ASILUM orders this on your behalf and routes the fulfillment ticket to "+src.label+"."}</div>
      <div style="display:flex;gap:12px;background:var(--panel2);border-radius:12px;padding:14px;margin-bottom:14px">
        <div style="width:60px;height:74px;border-radius:8px;background:${swatch(item)}"></div>
        <div style="flex:1"><div style="font-family:var(--serif);font-size:18px;font-weight:600">${esc(item.brand)}</div>
        <div class="dim" style="font-size:12px">${esc(item.name)}</div>
        <div style="font-size:12px;margin-top:4px">Size ${esc(item.size)} · <span class="badge-src" style="background:${src.color};color:#fff">${src.label}</span></div></div>
        <div class="mono" style="font-size:16px;font-weight:700">${money(item.price)}</div>
      </div>
      ${item.source!=="ASILUM" && !hasAcct ? `
      <div style="border:1px solid var(--red-dim);background:rgba(229,52,43,.07);border-radius:12px;padding:12px 14px;margin-bottom:12px">
        <div style="font-weight:700;font-size:13px;color:var(--ink)">⚠ Heads up — we'll create a ${src.label} account for you</div>

      <button class="btn" style="width:100%;margin-top:10px" onclick="BuyFlow.execute('${item.id}')">PLACE ORDER — ${money(item.price)}</button>

    `);
  },
  execute(itemId){

  STAGES: [

    ["account_check","Checking your "+"account"],

    ["order_placed","Placing order on your behalf"],

        <div class="tkt-step ${i===0?'done':i===1?'active':''}" data-stage="${s[0]}"><div class="tkt-num">${i===0?'✓':i+1}</div><div class="tkt-b"><div class="tk-t">${s[1]}</div></div></div>`).join("")}</div>

/* helpers shared by many modules (defined here, used everywhere) */

/* localStorage wrapper (namespaced, safe) */

<script>
/* =====================================================================
   APP — routing, views, virtualized feed, social, profile, init.

  route:"home", feedTab:"foryou", edReading:null, viewingProfile:null,

  },
  save(){ Store.set("user",this.user);Store.set("likes",this.likes);Store.set("bag",this.bag);
    Store.set("history",this.history);Store.set("followUsers",this.followUsers);Store.set("followBrands",this.followBrands);Store.set("myPosts",this.myPosts); },

  bindGlobal(){
    document.getElementById("composeBtn").onclick=()=>this.composeModal();
    document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") this.closeModal(); });
  },

  /* ---------------- nav ---------------- */
  NAV:[["home","⌂","Home"],["discover","◈","Discover"],["stylist","✂","Stylist"],["brain","◉","Mood Board"],
       ["editorial","¶","Editorial"],["tickets","⛿","Orders"],["bag","▤","Bag"],["profile","◍","Profile"],["settings","⚙","Settings"]],
  buildNav(){
    document.getElementById("nav").innerHTML = this.NAV.map(([k,i,l])=>`
      <a class="navitem" data-r="${k}" onclick="App.go('${k}')"><span class="ico">${i}</span><span class="lbl">${l}</span>
      ${k==="bag"?`<span class="ncount" id="navBag" style="display:none">0</span>`:""}
      ${k==="tickets"?`<span class="ncount" id="navTkt" style="display:none">0</span>`:""}</a>`).join("");
    this.updateBadges();
  },
  updateBadges(){
    const b=document.getElementById("navBag"); if(b){ b.textContent=this.bag.length; b.style.display=this.bag.length?"flex":"none"; }
    const active=PartnerLink.tickets().filter(t=>t.status!=="fulfilling"&&t.status!=="fulfilled").length;
    const t=document.getElementById("navTkt"); if(t){ t.textContent=PartnerLink.tickets().length; t.style.display=PartnerLink.tickets().length?"flex":"none"; }
  },
  go(r){
    if(r==="bag"){ this.openBag(); return; }
    this.route=r; this.viewingProfile=null;
    document.querySelectorAll(".navitem").forEach(n=>n.classList.toggle("active",n.dataset.r===r));
    BrainViz.stop();
    const map={home:"renderHome",discover:"renderDiscover",stylist:"renderStylist",brain:"renderBrain",
      editorial:"renderEditorial",tickets:"renderTickets",profile:"renderProfile",settings:"renderSettings"};
    this[map[r]] && this[map[r]]();
    document.getElementById("center").scrollTop=0;
  },

  /* ---------------- HOME (feed) ---------------- */
  renderHome(){
    const c=document.getElementById("center");
    c.innerHTML=`
      <div class="col-head"><div class="ch-title">Home</div>
        <div class="tabs">
          <button class="${this.feedTab==='foryou'?'on':''}" onclick="App.setFeed('foryou')">For You</button>
          <button class="${this.feedTab==='following'?'on':''}" onclick="App.setFeed('following')">Following</button>
          <button class="${this.feedTab==='fresh'?'on':''}" onclick="App.setFeed('fresh')">Fresh Drops</button>
        </div>
      </div>
      ${this.user?this.composeInlineHTML():""}
      ${!Observer.enabled()&&this.user?`<div class="obs-banner"><div style="font-size:22px">◉</div><div style="flex:1"><div class="ob-t">Let the brain learn faster</div><div class="ob-d">Opt in to on-device observation — ASILUM notes aesthetics you linger on, nothing leaves your device.</div></div><button class="btn sm" onclick="App.enableObs()">TURN ON</button></div>`:""}
      <div id="feedList"></div>
      <div id="feedSentinel" style="padding:24px;text-align:center" class="dim mono" style="font-size:11px">loading…</div>`;
    this.feedState={items:this.currentFeed(),rendered:0};
    this.renderFeedChunk();
    this.armInfinite();
  },
  composeInlineHTML(){
    return `<div class="compose-inline"><div class="ci-pfp" style="background:${this.avatar(this.user)}"></div>
      <div class="ci-main"><textarea id="ciText" placeholder="What are you wearing?" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <div class="ci-foot"><div class="ci-tools"><button onclick="App.toast('Attach a piece from the feed → Post It')">🖼</button><button onclick="App.toast('Tag a brand with #')">＃</button></div>
      <button class="btn sm" onclick="App.quickPost()">Post</button></div></div></div>`;
  },
  setFeed(t){ this.feedTab=t; this.renderHome(); },
  currentFeed(){
    if(this.feedTab==="fresh"){ return [...this.catalog].filter(x=>x.era.year>=2020).sort((a,b)=>b.era.year-a.era.year||b.likes-a.likes).slice(0,120); }
    if(this.feedTab==="following"){
      // interleave followed users' tweets + followed brands' items + ranked catalog
      const fb=Object.keys(this.followBrands).filter(b=>this.followBrands[b]);
      const brandItems=this.catalog.filter(x=>fb.includes(x.brand));
      const followTweets=this.tweets.filter(t=>this.followUsers[t.uid]);
      const mix=[...followTweets.map(t=>({_t:t})), ...Brain.rank(brandItems.length?brandItems:this.catalog,60).map(i=>({_i:i}))];
      return mix.length?mix:this.blendFeed();
    }
    return this.blendFeed();
  },
  blendFeed(){
    const ranked=Brain.rank(this.catalog,80);
    const out=[]; let ti=0;
    ranked.forEach((it,i)=>{ out.push({_i:it}); if((i+1)%5===0 && ti<this.tweets.length){ out.push({_t:this.tweets[ti++]}); } });
    return out;
  },
  renderFeedChunk(){
    const s=this.feedState; const list=document.getElementById("feedList"); if(!list) return;
    const slice=s.items.slice(s.rendered,s.rendered+20);
    list.insertAdjacentHTML("beforeend", slice.map(e=> e._t?this.tweetHTML(e._t): this.productHTML(e._i)).join(""));
    s.rendered+=slice.length;
    this.armDwell();
    if(s.rendered>=s.items.length){ const sen=document.getElementById("feedSentinel"); if(sen) sen.innerHTML=`<div class="dim mono" style="font-size:11px">— the brain re-ranks on refresh —</div><button class="btn ghost sm" style="margin-top:10px" onclick="App.renderHome()">REFRESH FEED</button>`; }
  },
  armInfinite(){
    if(this._io2) this._io2.disconnect();
    const sen=document.getElementById("feedSentinel"); if(!sen) return;
    this._io2=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting && this.feedState.rendered<this.feedState.items.length) this.renderFeedChunk(); }); },{root:document.getElementById("center"),rootMargin:"600px"});
    this._io2.observe(sen);
  },
  productHTML(it){
    const src=SOURCES[it.source]; const liked=this.likes[it.id];
    const topTags=Object.entries(it.tags).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([t])=>t);
    return `<div class="pcard" data-id="${it.id}" onclick="App.openItem('${it.id}')">
      <div class="pc-img" style="background:${swatch(it)}"><span class="src-tag" style="background:${src.color}cc">${src.label}</span>${it.rare?'<span class="rare-tag">GRAIL</span>':""}</div>
      <div class="pc-body">
        <div class="pc-brand">${esc(it.brand)}</div>
        <div class="pc-name">${esc(it.name)}</div>
        <div class="pc-tagrow">${topTags.map(t=>`<span class="tag-chip">${t}</span>`).join("")}<span class="tag-chip">${esc(it.cat)}</span></div>
        <div class="pc-why">${Brain.why(it)}</div>
        <div class="pc-foot">
          <div class="pc-price">${money(it.price)}</div>
          <div class="pc-actions" onclick="event.stopPropagation()">
            <button class="mini-btn ${liked?'on':''}" onclick="App.like('${it.id}',event)" title="Like">${liked?'♥':'♡'}</button>
            <button class="mini-btn" onclick="App.go('stylist');App.stylistAnchor='${it.id}';App.renderStylist()" title="Style around this">✂</button>
            <button class="mini-btn bag" onclick="App.addBag('${it.id}')" title="Add to bag">▤</button>
            <button class="buy-btn" onclick="BuyFlow.start(App.byId('${it.id}'))">BUY</button>
          </div>
        </div>
      </div></div>`;
  },
  tweetHTML(tw){
    const u=tw.uid.startsWith("bot")?this.bot(tw.uid):(this.user&&tw.uid===this.user.handle?this.user:null);
    const name=u?(u.name||u.handle):tw.uid, handle=u?(u.handle||tw.uid):tw.uid, verified=u&&u.verified;
    const item=tw.item?this.byId(tw.item):null; const liked=this._twLikes&&this._twLikes[tw.id];
    return `<div class="tweet" data-tw="${tw.id}">
      <div class="tw-pfp" style="background:${u?this.avatar(u):tagSwatch('MINIMAL')}" onclick="App.openUser('${tw.uid}')"></div>
      <div class="tw-body">
        <div class="tw-head"><span class="tw-name" onclick="App.openUser('${tw.uid}')">${esc(name)}</span>${verified?'<span class="tw-verify">✦</span>':""}
          <span class="tw-handle">@${esc(handle)}</span><span class="tw-time">· ${timeAgo(tw.t)}</span></div>
        <div class="tw-text">${esc(tw.text)}</div>
        ${tw.img?`<div class="tw-img" style="background:${tagSwatch(tw.img)}"></div>`:""}
        ${item?`<div class="tw-embed" onclick="App.openItem('${item.id}')"><div class="te-img" style="background:${swatch(item)}"></div>
          <div class="te-b"><div class="te-brand">${esc(item.brand)}</div><div class="dim" style="font-size:12px">${esc(item.name)}</div>
          <div class="te-price">${money(item.price)} · ${SOURCES[item.source].label}</div></div></div>`:""}
        <div class="tw-actions">
          <button class="tw-act" onclick="App.toast('Replies coming to mobile build')">💬 ${fmt(tw.replies)}</button>
          <button class="tw-act" onclick="App.toast('Reposted')">⇄ ${fmt(tw.reposts)}</button>
          <button class="tw-act ${liked?'liked':''}" onclick="App.likeTweet('${tw.id}',event)">♥ ${fmt(tw.likes+(liked?1:0))}</button>
          <button class="tw-act" onclick="App.toast('Link copied')">↗</button>
        </div>
      </div></div>`;
  },
  armDwell(){
    if(this._io) this._io.disconnect();
    this._io=new IntersectionObserver(es=>{ es.forEach(en=>{ const id=en.target.dataset.id; if(!id) return; const it=this.byId(id); if(!it) return;
      if(en.isIntersecting){ Brain.signal("impression",it); en.target._dt=setTimeout(()=>Brain.signal("dwell",it),2200); }
      else if(en.target._dt){ clearTimeout(en.target._dt); } }); },{root:document.getElementById("center"),threshold:.6});
    document.querySelectorAll(".pcard[data-id]").forEach(el=>this._io.observe(el));
  },

  /* ---------------- interactions ---------------- */
  like(id,ev){ if(ev)ev.stopPropagation(); const it=this.byId(id); this.likes[id]=!this.likes[id];
    Brain.signal(this.likes[id]?"like":"unlike",it); this.save();
    const btn=document.querySelector(`.pcard[data-id="${id}"] .mini-btn`); if(btn){btn.classList.toggle("on",this.likes[id]);btn.innerHTML=this.likes[id]?'♥':'♡';} },
  likeTweet(tid,ev){ ev.stopPropagation(); this._twLikes=this._twLikes||{}; this._twLikes[tid]=!this._twLikes[tid];
    const tw=this.tweets.find(t=>t.id===tid)||this.myPosts.find(t=>t.id===tid); if(tw) Brain.signal("like",{tags:tw.tags||[pick(TAGS)]});
    const el=document.querySelector(`.tweet[data-tw="${tid}"] .tw-act.liked`)||document.querySelector(`.tweet[data-tw="${tid}"] .tw-act:nth-child(3)`);
    if(el){ el.classList.toggle("liked",this._twLikes[tid]); } },
  addBag(id){ const it=this.byId(id); this.bag.push(it); Brain.signal("bag",it); this.save(); this.updateBadges(); this.toast("Added — "+it.brand); },
  openItem(id){
    const it=this.byId(id); Brain.signal("open",it); const src=SOURCES[it.source];
    const lore = (typeof BRAND_LORE!=="undefined"&&BRAND_LORE[it.brand])||null;
    this.modal(`
      <div style="height:220px;border-radius:12px;background:${swatch(it)};margin-bottom:14px;position:relative">
        <span class="badge-src" style="position:absolute;top:12px;left:12px;background:${src.color};color:#fff">${src.label}</span>
        ${it.rare?'<span class="rare-tag" style="position:absolute;top:12px;right:12px">GRAIL</span>':""}</div>
      <div class="m-title">${esc(it.brand)}</div>
      <div class="dim" style="font-size:13px">${esc(it.name)} · Size ${esc(it.size)}</div>
      <div class="mono" style="font-size:20px;font-weight:700;margin:10px 0">${money(it.price)}</div>
      <div class="pc-tagrow" style="margin-bottom:12px">${Object.entries(it.tags).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([t,w])=>`<span class="tag-chip">${t} ${(w*100|0)}</span>`).join("")}</div>
      <div class="mono faint" style="font-size:11px;margin-bottom:14px">${it.material} · ${it.era.decade} · via ${src.label} ${src.authorized?'(authorized)':'(pending partnership)'}</div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" style="flex:1" onclick="App.closeModal();App.stylistAnchor='${it.id}';App.go('stylist')">STYLE IT</button>
        <button class="btn ghost" style="flex:1" onclick="App.addBag('${it.id}');App.closeModal()">ADD TO BAG</button>
        <button class="btn" style="flex:1" onclick="App.closeModal();BuyFlow.start(App.byId('${it.id}'))">BUY</button>
      </div>`);
  },

  /* ---------------- DISCOVER ---------------- */
  renderDiscover(){
    const c=document.getElementById("center");
    const active=this._discSrc||"ALL", tag=this._discTag||null;
    let pool=this.catalog;
    if(active!=="ALL") pool=pool.filter(x=>x.source===active);
    if(tag) pool=pool.filter(x=>x.tags[tag]>.3);
    pool=Brain.rank(pool,60);
    c.innerHTML=`
      <div class="col-head"><div class="ch-title">Discover<span class="mono dim" style="font-size:12px;font-weight:400">${this.catalog.length} pieces · ${SOURCE_KEYS.length} sources</span></div>
        <div style="padding:10px 0 12px;white-space:nowrap;overflow-x:auto">
          ${["ALL",...SOURCE_KEYS].map(s=>`<span class="pill ${active===s?'on':''}" onclick="App._discSrc='${s}';App.renderDiscover()">${s==="ALL"?"All sites":SOURCES[s].label}${s!=="ALL"&&!SOURCES[s].authorized?' <span class="faint" style="font-size:9px">◐</span>':''}</span>`).join("")}
        </div>
        <div style="padding-bottom:10px;white-space:nowrap;overflow-x:auto">
          ${TAGS.map(t=>`<span class="pill ${tag===t?'on':''}" onclick="App._discTag=App._discTag==='${t}'?null:'${t}';App.renderDiscover()">${t}</span>`).join("")}
        </div>
      </div>
      ${pool.map(it=>this.productHTML(it)).join("")||'<div class="empty"><span class="big">Nothing here yet</span>Try another site or aesthetic.</div>'}`;
    this.armDwell();
  },

  /* ---------------- STYLIST ---------------- */
  stylistAnchor:null,
  renderStylist(){
    const c=document.getElementById("center");
    const anchor=this.stylistAnchor?this.byId(this.stylistAnchor):null;
    const fits=Stylist.slate(this.catalog,3,anchor);
    this._fits=fits;
    c.innerHTML=`
      <div class="col-head"><div class="ch-title">The Stylist</div>
        <div class="ch-sub">Full outfits assembled across every site, matched to your brain${anchor?` · anchored on <b>${esc(anchor.brand)}</b>`:""}. <a style="color:var(--red)" onclick="App.stylistAnchor=null;App.renderStylist()">${anchor?"clear anchor":""}</a></div>
        <div style="padding-bottom:12px"><button class="btn sm" onclick="App.renderStylist()">↻ REGENERATE</button>
        ${this.user&&this.user.fit?'':`<button class="btn ghost sm" onclick="App.fitModal()">SET YOUR SIZE</button>`}</div>
      </div>
      ${fits.map((f,i)=>this.outfitHTML(f,i)).join("")}`;
  },
  outfitHTML(f,i){
    return `<div style="border-bottom:1px solid var(--line);padding:18px">
      <div class="flex between center" style="margin-bottom:12px">
        <div><div style="font-family:var(--serif);font-size:22px;font-weight:700">${esc(f.title)}</div>
        <div class="mono dim" style="font-size:11px;margin-top:2px">${f.sources.map(s=>SOURCES[s].label).join(" · ")}</div></div>
        <div style="text-align:right"><div class="mono" style="font-size:22px;font-weight:700;color:var(--red)">${f.conf}%</div><div class="mono faint" style="font-size:9px">MATCH</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(${Math.min(f.items.length,5)},1fr);gap:8px">
        ${f.items.map(it=>`<div onclick="App.openItem('${it.id}')" style="cursor:pointer">
          <div style="aspect-ratio:3/4;border-radius:8px;background:${swatch(it)};position:relative">
            <span class="src-tag" style="position:absolute;bottom:5px;left:5px;font-family:var(--mono);font-size:7px;background:${SOURCES[it.source].color}cc;color:#fff;padding:1px 4px;border-radius:2px">${SOURCES[it.source].label}</span></div>
          <div style="font-size:11px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.brand)}</div>
          <div class="mono dim" style="font-size:10px">${money(it.price)}</div></div>`).join("")}
      </div>
      <div class="mono faint" style="font-size:10px;margin:12px 0 10px">${esc(f.why)} · TOTAL ${money(f.total)}</div>
      <div class="flex gap8">
        <button class="btn ghost sm" onclick="App.passFit(${i})">PASS</button>
        <button class="btn ghost sm" onclick="App.postFit(${i})">POST FIT</button>
        <button class="btn sm" style="flex:1" onclick="App.buyFit(${i})">BAG ALL — ${money(f.total)}</button>
      </div></div>`;
  },
  buyFit(i){ const f=this._fits[i]; f.items.forEach(it=>{this.bag.push(it);Brain.signal("outfit_buy",it);}); this.save(); this.updateBadges(); this.toast(`Outfit bagged · ${f.conf}% match`); },
  passFit(i){ this._fits[i].items.forEach(it=>Brain.signal("outfit_pass",it)); this.toast("Recalibrating…"); this.renderStylist(); },
  postFit(i){ if(!this.user){this.go("profile");return this.toast("Sign in to post");} const f=this._fits[i];
    this.myPosts.unshift({id:"mp"+Date.now(),uid:this.user.handle,text:`${f.title} — ${f.items.map(x=>x.brand).join(" × ")}`,tags:[f.dom],item:f.items[0].id,likes:0,reposts:0,replies:0,t:Date.now()});
    Brain.signal("post",{tags:[f.dom]}); this.save(); this.toast("Posted to your profile"); },
  fitModal(){ this.modal(`<div class="m-title">Your size</div><div class="m-sub">Used to filter fits (fit-gating). Stays on your device.</div>
    <label class="lbl">Usual size</label><select class="field" id="fitSize"><option>XS</option><option selected>M</option><option>S</option><option>L</option><option>XL</option></select>
    <label class="lbl">Chest (in)</label><input class="field" id="fitChest" value="38"><label class="lbl">Waist (in)</label><input class="field" id="fitWaist" value="32">
    <button class="btn" style="width:100%;margin-top:14px" onclick="App.saveFit()">SAVE</button>`); },
  saveFit(){ if(!this.user)this.user={}; this.user.fit={size:val('fitSize'),chest:+val('fitChest'),waist:+val('fitWaist')}; this.save(); this.closeModal(); this.toast("Size saved"); this.renderStylist(); },

  /* ---------------- helper ---------------- */
  avatar(u){ return u&&u.pfp?`#222 url(${u.pfp}) center/cover`:tagSwatch((u&&(u.pfpTag||u.bannerTag))||pick(TAGS)); },
  toast(msg,cls){ const t=document.getElementById("toast"); t.className=cls||""; t.textContent=msg; t.classList.add("show"); clearTimeout(this._tt); this._tt=setTimeout(()=>t.classList.remove("show"),2000); },
  modal(html){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").classList.add("open"); },
  closeModal(){ document.getElementById("modal").classList.remove("open"); },
  pushTicker(html){ this.ticker.unshift({html,t:Date.now()}); this.ticker=this.ticker.slice(0,8); this.renderTickerBox(); },
  seedTicker(){ ["<b>Duran Lantink</b> named creative director rumor mill spins","<b>Salomon × Kiko</b> round four leaked","resale volume passes retail — <b>market report</b>","<b>A$AP</b> pulls a 2003 N(N)ine grail"].forEach(h=>this.ticker.push({html:h,t:Date.now()})); },
  onBrainSignal(){ if(this.route==="brain") BrainViz.pulse(); },
  onTicketUpdate(t){ this.updateBadges(); if(this._openTicketId===t.id) this.advanceTracker(t); if(this.route==="tickets") this.renderTickets(); },
  advanceTracker(t){
    const stages=BuyFlow.STAGES.map(s=>s[0]); const cur=stages.indexOf(t.stage);
    document.querySelectorAll("#tktSteps .tkt-step").forEach((el)=>{
      const si=stages.indexOf(el.dataset.stage);
      const done = si>=0 && si<cur, active = si===cur, failed = t.stage==="dead_letter";
      el.classList.toggle("done", done); el.classList.toggle("active", active);
      if(done) el.querySelector(".tkt-num").textContent="✓";
      if(active && failed){ el.querySelector(".tk-t").innerHTML += ' <span style="color:var(--red)">— failed, will retry</span>'; }
    });
    if(t.stage==="fulfilled" && t.tracking){ const tr=document.getElementById("tktTracking");
      if(tr) tr.innerHTML=`● ${esc(t.tracking.carrier)} · ${esc(t.tracking.trackingNo)} · ETA ${esc(t.tracking.eta||"—")}`; }
  },
};
function val(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
function fmt(n){ return n>999?(n/1000).toFixed(1)+"k":n; }
function timeAgo(t){ const s=(Date.now()-t)/1000; if(s<60)return"now"; if(s<3600)return(s/60|0)+"m"; if(s<86400)return(s/3600|0)+"h"; return(s/86400|0)+"d"; }
</script>
<script>
/* =====================================================================
   APP — remaining views: brain, editorial, tickets, profile/social,
   settings, right rail, bag, compose, init.
   ===================================================================== */
Object.assign(App, {

  /* ---------------- BRAIN ---------------- */
  renderBrain(){
    const c=document.getElementById("center");
    const board=Brain.moodboard();
    const imgs=this.moodImages||[];
    const pin=Store.get("pinterest");
    c.innerHTML=`
      <div class="col-head"><div class="ch-title">Mood Board</div><div class="ch-sub">Everything here trains your brain. The sphere shows it thinking (white) and forgetting (red) — drag to rotate.</div></div>

      <div style="padding:16px 18px;border-bottom:1px solid var(--line)">
        <div class="mono" style="font-size:9px;letter-spacing:3px;color:var(--red);margin-bottom:8px">WORDS — MOODS, COLORS, CITIES, FABRICS, MUSIC, BRANDS</div>
        <div style="display:flex;gap:8px">
          <input class="field" id="moodInput" placeholder="berlin, leather, quiet, rick owens, goretex…" onkeydown="if(event.key==='Enter')App.trainMood()">
          <button class="btn sm" onclick="App.trainMood()">TRAIN</button>
        </div>
        <div style="margin-top:10px" id="moodChips">
          ${board.length?board.map(t=>`<span class="pill on" style="font-size:11px" onclick="App.removeMood('${esc(t)}')">${esc(t)} ✕</span>`).join("")

  renderBrainStats(){

    const el=document.getElementById("brainStats"); if(el) el.innerHTML=rows.length?rows.map(([t,w])=>`

  resetBrain(){ ["brain","seen","moodboard"].forEach(k=>Store.del(k)); Brain.vec={}; Brain.meta={recent:[],forgotten:[],events:0,lastActive:Date.now(),streakTag:null,streak:0,fatigue:0}; this.toast("Amnesia complete"); this.renderBrain(); },
  trainMood(){ const el=document.getElementById("moodInput"); const text=el?el.value.trim():""; if(!text) return this.toast("Type a mood, a city, a fabric, a brand…");
    const {hits,misses}=Brain.train(text);

  connectPinterest(){
    this.modal(`<div class="m-title">Connect Pinterest</div>
      <div class="m-sub">ASILUM will read your <b>public</b> pins to learn the aesthetics you save. Signals stay on your device; you can disconnect anytime.</div>

  doConnectPinterest(){
    const h=(val('pinHandle')||"@you").replace(/^@?/,'@');
    if(!document.getElementById("pinConsent").checked) return this.toast("Please authorize the connection");
    // demo: derive a taste sample the "boards" would imply, and train the brain
    const sample=["archive","minimal","gorp","opium","quiet"].sort(()=>Math.random()-.5).slice(0,3);
    sample.forEach(t=>Brain.train(t));
    Store.set("pinterest",{handle:h,pins:rint(80,600),trained:sample,at:Date.now()});
    this.closeModal(); this.toast("Pinterest connected — brain trained on "+sample.join(", ")); this.renderBrain();
  },
  disconnectPinterest(){ Store.del("pinterest"); this.toast("Pinterest disconnected"); this.renderBrain(); },
  uploadMoodImages(files){
    this.moodImages=this.moodImages||[];
    let done=0; const n=files.length;
    [...files].slice(0,12).forEach(f=>{
      const r=new FileReader();
      r.onload=e=>{ this.moodImages.unshift({src:e.target.result, tags:[], name:f.name});
        // seed a light signal from the filename via the lexicon (auto-tag stand-in)
        const guess=moodVector(f.name.replace(/\.[a-z]+$/i,"").replace(/[_-]/g," "));
        if(guess.hits.length) guess.hits.forEach(()=>Brain.signal("observe",{tags:Object.keys(guess.vec)}));
        if(++done>=Math.min(n,12)) this.renderBrain();
      };
      r.readAsDataURL(f);
    });
    this.toast("Added "+Math.min(n,12)+" image"+(n>1?"s":"")+" — tag the vibe to teach the brain");
  },
  tagMoodImage(i,tag){
    const im=this.moodImages[i]; if(!im) return;
    im.tags=im.tags||[];
    if(im.tags.includes(tag)){ im.tags=im.tags.filter(t=>t!==tag); Brain.removeMood(tag); }
    else { im.tags.push(tag); Brain.train(tag); }
    this.renderBrain();
  },

  /* ---------------- BAG ---------------- */
  openBag(){ const d=document.getElementById("bagDrawer"); d.classList.add("open");
    const items=document.getElementById("bagItems");
    items.innerHTML=this.bag.length?this.bag.map((it,i)=>`<div class="bd-item"><div class="bi-img" style="background:${swatch(it)}"></div>
      <div><div style="font-weight:700;font-size:13px">${esc(it.brand)}</div><div class="dim" style="font-size:11px">${esc(it.name)}</div>
      <div class="bi-src">${SOURCES[it.source].label} · ${money(it.price)}</div></div><button class="rm" onclick="App.rmBag(${i})">✕</button></div>`).join("")
      :`<div class="empty"><span class="big">Bag empty</span>The brain notices what you carry.</div>`;
    const sub=this.bag.reduce((s,i)=>s+i.price,0); const fee=this.bag.reduce((s,i)=>s+this.feeOf(i.price),0);
    document.getElementById("bagSub").textContent=money(sub);
    document.getElementById("bagFee").textContent="$"+fee.toFixed(2);
    document.getElementById("bagTotal").textContent="$"+(sub+fee).toFixed(2);
    const srcs=[...new Set(this.bag.map(i=>i.source))];
    document.getElementById("bagSources").textContent=this.bag.length?`Routes to ${srcs.length} site${srcs.length>1?"s":""}: ${srcs.map(s=>SOURCES[s].label).join(", ")}`:"";
  },
  closeBag(){ document.getElementById("bagDrawer").classList.remove("open"); },
  rmBag(i){ Brain.signal("unbag",this.bag[i]); this.bag.splice(i,1); this.save(); this.updateBadges(); this.openBag(); },
  checkout(){ if(!this.bag.length) return this.toast("Bag is empty"); if(!this.user){this.closeBag();this.go("profile");return this.toast("Sign in to check out");}
    const items=[...this.bag]; this.bag=[]; this.save(); this.updateBadges(); this.closeBag();
    const sites=new Set(); const userInfo={ name:this.user.name||this.user.handle, email:this.user.email||(this.user.handle+"@asilum.app") };
    items.forEach(it=>{ sites.add(it.source); Brain.signal("purchase",it);
      this.history.unshift({t:Date.now(),item:{id:it.id,brand:it.brand,name:it.name,price:it.price,source:it.source},total:it.price});
      if(it.source!=="ASILUM"){ Brain.signal("ticket",it);
        // each partner item → its own ticket through the engine (idempotent, provisions account once per site)
        this.tickets.enqueue({ userId:this.user.handle, source:it.source, itemId:it.id, brand:it.brand, name:it.name, price:it.price, consent:true, userInfo });
      }
    });
    const fee=items.reduce((s,i)=>s+this.feeOf(i.price),0);
    this.save();
    this.toast(`Checked out ${items.length} across ${sites.size} site${sites.size>1?"s":""} · $${fee.toFixed(2)} ASILUM fee`);
    this.pushTicker(`checkout: ${items.length} pieces across ${sites.size} sites · $${fee.toFixed(2)} fee`);
    this.go("tickets");
  },
